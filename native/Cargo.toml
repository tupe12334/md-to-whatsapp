[package]
name = "md-to-whatsapp"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Convert Markdown to WhatsApp message formatting"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
regex = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
