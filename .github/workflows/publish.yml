name: Publish

on:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build native
        run: pnpm build:native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to platform packages
        run: |
          # Move binaries to their respective npm directories
          cp artifacts/bindings-aarch64-apple-darwin/*.node npm/darwin-arm64/ 2>/dev/null || true
          cp artifacts/bindings-x86_64-unknown-linux-gnu/*.node npm/linux-x64-gnu/ 2>/dev/null || true
          cp artifacts/bindings-x86_64-pc-windows-msvc/*.node npm/win32-x64-msvc/ 2>/dev/null || true

          # Also keep a copy in root for backward compatibility during development
          for dir in artifacts/bindings-*; do
            cp "$dir"/*.node . 2>/dev/null || true
          done

          echo "Platform packages:"
          ls -la npm/*/

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Check if version is published
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "md-to-whatsapp@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "Version ${PACKAGE_VERSION} already published"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${PACKAGE_VERSION} not published yet"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish platform packages
        if: steps.check.outputs.should_publish == 'true'
        run: |
          for pkg in npm/darwin-arm64 npm/linux-x64-gnu npm/win32-x64-msvc; do
            PKG_NAME=$(node -p "require('./$pkg/package.json').name")
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
              echo "Skipping $PKG_NAME@$PKG_VERSION (already published)"
            else
              echo "Publishing $PKG_NAME@$PKG_VERSION"
              cd $pkg && npm publish --access public && cd ../..
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
